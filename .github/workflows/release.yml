name: Release

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

env:
  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  check-version:
    name: Check if version changed
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check.outputs.version_changed }}
      new_version: ${{ steps.check.outputs.new_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get current version
        id: version
        run: |
          VERSION=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "new_version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Check if version changed
        id: check
        run: |
          CURRENT_VERSION=${{ steps.version.outputs.new_version }}
          git fetch --tags
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No previous tag found, this is a new release"
            echo "version_changed=true" >> $GITHUB_OUTPUT
          else
            PREVIOUS_VERSION=$(echo "$PREVIOUS_TAG" | sed 's/^v//')
            echo "Previous version: $PREVIOUS_VERSION"
            echo "Current version: $CURRENT_VERSION"

            if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
              echo "version_changed=true" >> $GITHUB_OUTPUT
            else
              echo "version_changed=false" >> $GITHUB_OUTPUT
            fi
          fi

  build-macos:
    name: Build macOS (${{ matrix.target }})
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Create app bundle
        run: |
          cargo install cargo-bundle --locked || true
          cargo bundle --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}-bundle
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/macos/*.app

  build-windows:
    name: Build Windows (x64)
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    # Usando a imagem nativa do Windows (igual ao Zed, mas no plano gratuito)
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      # Opcional: Cache para acelerar builds futuros
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        # Usamos o shell 'pwsh' (PowerShell Core) para consistência com o Windows
        shell: pwsh
        run: |
          cargo build --release --target x86_64-pc-windows-msvc --bin acterminal

      # O Zed costuma gerar apenas o .exe ou um instalador simples. 
      # Se o cargo-bundle falhar (ele é instável no Windows), use esta etapa manual:
      - name: Prepare Artifact
        shell: pwsh
        run: |
          mkdir release-dist
          copy target/x86_64-pc-windows-msvc/release/acterminal.exe release-dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64-binary
          path: release-dist/acterminal.exe

 
  create-release:
    name: Create GitHub Release
    needs: [check-version, build-macos, build-windows]
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Setup Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create tag
        run: |
          git tag v${{ needs.check-version.outputs.new_version }}

      - name: Push tag
        run: |
          git push origin v${{ needs.check-version.outputs.new_version }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.new_version }}
          name: ACTerminal v${{ needs.check-version.outputs.new_version }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
