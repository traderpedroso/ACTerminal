[package]
name = "acterminal"
description = "A real-time trading system."
version = "0.5.0"
publish = false
edition = "2024"

[dependencies]
anyhow = "1"
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-component-assets = { path = "crates/assets" }
gpui-component = { path = "crates/ui", version = "0.5.1" }
sysinfo = "0.37"
smol = "2"
zenoh = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["sync", "rt-multi-thread"] }
futures = "0.3"
log = "0.4"
chrono = "0.4"
rand = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33"
core-foundation = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
] }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
correctness = "deny"
suspicious = "warn"
style = "warn"
complexity = "warn"
perf = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"
debug = true
strip = false

[profile.dev]
opt-level = 0
debug = true

[profile.dev.package."*"]
opt-level = 3

[package.metadata.bundle]
name = "ACTerminal"
identifier = "com.exemplo.acterminal"
icon = ["assets/acterminal.icns", "assets/acterminal.ico", "assets/acterminal.png"]
copyright = "SOSTRADER Copyright © 2024"


[package.metadata.packager]
product_name = "ACTerminal"
identifier = "com.exemplo.acterminal"
version = "0.1.0"
copyright = "SOSTRADER Copyright © 2024"
icons = ["assets/acterminal.icns", "assets/acterminal.ico", "assets/acterminal.png"]
