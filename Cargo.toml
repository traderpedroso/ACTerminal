[package]
name = "icetrader"
description = "A real-time trading system."
version = "0.5.0"
publish = false
edition = "2024"

[dependencies]
anyhow.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
gpui-component-assets.workspace = true
gpui-component.workspace = true
sysinfo = "0.37"
smol.workspace = true
battery = "0.7"
zmq = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["sync", "rt-multi-thread"] }
futures = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33"
core-foundation = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
] }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
correctness = "deny"
suspicious = "warn"
style = "warn"
complexity = "warn"
perf = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"
debug = true
strip = false

[profile.dev]
opt-level = 0
debug = true

[profile.dev.package."*"]
opt-level = 3
